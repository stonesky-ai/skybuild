name: skybuild-pilot
services:
  db:
    image: postgres:16
    pull_policy: never
    container_name: skybuild-pilot-pg
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/admin-password
    volumes:
      - ${SKYBUILD_PILOT_STATE:?Set SKYBUILD_PILOT_STATE}/pgdata:/var/lib/postgresql/data
      - ${SKYBUILD_PILOT_STATE:?Set SKYBUILD_PILOT_STATE}/secrets/admin-password:/run/secrets/admin-password:ro
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 768m
    pids_limit: 128
    restart: unless-stopped
  api:
    build:
      context: ../..
      dockerfile: ops/manual-pilot/Dockerfile
    image: skybuild-pilot-api:local
    container_name: skybuild-pilot-api
    env_file:
      - path: ${SKYBUILD_PILOT_STATE:?Set SKYBUILD_PILOT_STATE}/runtime.env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
