name: skybuild-pilot
services:
  workbench:
    image: ${SKYBUILD_WORKBENCH_IMAGE:?Set the reviewed Workbench image ID as sha256:<image-id>}
    pull_policy: never
    container_name: skybuild-workbench
    user: "1000"
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command:
      - --ui-checkout
      - /runtime-ui/ui
      - --api-checkout
      - /app
      - --ca-file
      - /tls/ca.crt
      - --backend-hostname
      - jeltz.tail991ac1.ts.net
      - --backend-connect-host
      - api
      - --backend-port
      - "8000"
      - --workbench-token-file
      - /run/secrets/skybuild-workbench-token
      - --workbench-project
      - skybuild
      - --workbench-username
      - ${SKYBUILD_WORKBENCH_USERNAME:?Set a Workbench username in the private runtime environment}
      - --workbench-password-file
      - /run/secrets/skybuild-workbench-password
      - --host
      - 0.0.0.0
      - --container-listener
      - --port
      - "8443"
      - --ssl-certfile
      - /tls/server.crt
      - --ssl-keyfile
      - /tls/server.key
    ports:
      - "127.0.0.1:8443:8443"
      - "100.95.249.118:8443:8443"
    volumes:
      - ${SKYBUILD_WORKBENCH_TOKEN_FILE:?Set a protected server-side API token path}:/run/secrets/skybuild-workbench-token:ro
      - ${SKYBUILD_WORKBENCH_PASSWORD_FILE:?Set a protected Workbench password path}:/run/secrets/skybuild-workbench-password:ro
      - /home/kevin/my_code/skybuild-pilot-state/tls/ca.crt:/tls/ca.crt:ro
      - /home/kevin/my_code/skybuild-pilot-state/tls/server.crt:/tls/server.crt:ro
      - /home/kevin/my_code/skybuild-pilot-state/tls/server.key:/tls/server.key:ro
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
